name: Validate AYFAR Web Push Edge Function

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/functions/ayfar-push/**"
      - "supabase/migrations/*web_push*"
      - ".github/workflows/validate-ayfar-push.yml"
  push:
    branches: [main]
    paths:
      - "supabase/functions/ayfar-push/**"
      - "supabase/migrations/*web_push*"
      - ".github/workflows/validate-ayfar-push.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Web Push Edge Function
        run: deno check --node-modules-dir=none supabase/functions/ayfar-push/index.ts
