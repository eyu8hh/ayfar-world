name: Validate AYFAR AI Quiz

on:
  pull_request:
    paths:
      - "js/games.js"
      - "supabase/functions/ayfar-ai-quiz/**"
      - "supabase/migrations/**"
      - ".github/workflows/validate-ai-quiz.yml"
  push:
    branches: [main]
    paths:
      - "js/games.js"
      - "supabase/functions/ayfar-ai-quiz/**"
      - "supabase/migrations/**"
      - ".github/workflows/validate-ai-quiz.yml"

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check game JavaScript syntax
        run: node --check js/games.js
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check AI Quiz Edge Function
        run: deno check supabase/functions/ayfar-ai-quiz/index.ts
